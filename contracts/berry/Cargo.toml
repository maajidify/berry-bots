[package]
name = "berry"
version = "0.1.0"
edition = "2021"
description = "Berry Bots: $BERRY NEP-141 token + game ledger (round settlement, bot wallets with spending caps)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

